<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctenos - ModaSur</title>
    <link rel="icon" href="/modaSur-1-2/images/favicon.ico" type="imagen/x-icon">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <div class="container-flex">
        
        <nav class="navbar">
            <div class="navbar-logo">
                <img src="/modaSur-1-2/images/logo.png" alt="Logo ModaSur" class="logo">
            </div>
            <ul>
                <li class="index">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="sobre-nosotros">
                    <a class="nav-link" href="sobre-nosotros.html">Sobre Nosotros</a>
                </li>
                <li class="servicios">
                    <a class="nav-link" href="servicios.html">Servicios</a>
                </li>
                <li class="contacto">
                    <a class="nav-link" href="contacto.html">Contáctenos</a>
                </li>
            </ul>
        </nav>

    <div class="container mt-5">
        <h1>Contáctenos</h1>
        <h2>Estamos aquí para ayudarte, deja tus datos y nos pondremos en contacto con usted</h2>
        <form>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="Tu correo">
            </div>
            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea class="form-control" id="mensaje" rows="3" placeholder="Tu mensaje"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>

    <footer class="footer">
        <h3>&copy; 2025 ModaSur - Todos los derechos reservados</h3>
    </footer>
</body>

</html>
